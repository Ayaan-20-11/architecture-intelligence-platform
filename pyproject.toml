[project]
name = "architecture-intelligence-poc"
version = "0.1.0"
description = "Architecture Intelligence Platform PoC: OpenAPI + AsyncAPI -> Canonical Model -> Neo4j -> analysis + LLM query"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "neo4j>=6.2.0",
    "openai>=3.3.1",
    "opentelemetry-proto>=1.44.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
