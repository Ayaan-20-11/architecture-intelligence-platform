<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-label="Pipeline: declared sources (OpenAPI, AsyncAPI, architecture.yaml) and observed OpenTelemetry traces both feed the Canonical Architecture Model, which imports into Neo4j, which serves deterministic Cypher analyses and read-only natural-language query.">
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a8"/>
    </marker>
    <marker id="arrow-declared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-observed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf60"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- arrows (under boxes) -->
    <line x1="535" y1="100" x2="535" y2="134" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
    <text x="562" y="122" fill="#9aa2b6" font-size="15" text-anchor="start">OTLP</text>

    <line x1="205" y1="100" x2="258" y2="254" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow-declared)"/>
    <text x="150" y="185" fill="#7dd3fc" font-size="16" font-weight="bold" text-anchor="middle">declared</text>

    <line x1="525" y1="216" x2="470" y2="254" stroke="#fbbf60" stroke-width="2.5" marker-end="url(#arrow-observed)"/>
    <text x="565" y="240" fill="#fbbf60" font-size="16" font-weight="bold" text-anchor="middle">observed</text>

    <line x1="360" y1="352" x2="360" y2="384" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
    <text x="387" y="373" fill="#9aa2b6" font-size="15" text-anchor="start">import</text>

    <line x1="320" y1="462" x2="215" y2="494" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
    <line x1="400" y1="462" x2="505" y2="494" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>

    <!-- Row A: sources -->
    <rect x="20" y="20" width="330" height="80" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="185" y="55" fill="#eef0f5" font-size="18" text-anchor="middle">OpenAPI + AsyncAPI +</text>
    <text x="185" y="80" fill="#eef0f5" font-size="18" text-anchor="middle">architecture.yaml</text>

    <rect x="370" y="20" width="330" height="80" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="535" y="55" fill="#eef0f5" font-size="18" text-anchor="middle">OpenTelemetry traces</text>
    <text x="535" y="80" fill="#eef0f5" font-size="18" text-anchor="middle">(optional)</text>

    <!-- Row B: observed facts + evidence -->
    <rect x="370" y="140" width="330" height="76" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="535" y="172" fill="#eef0f5" font-size="18" text-anchor="middle">observed facts</text>
    <text x="535" y="197" fill="#eef0f5" font-size="18" text-anchor="middle">+ evidence</text>

    <!-- Row C: Canonical Architecture Model -->
    <rect x="110" y="260" width="500" height="92" rx="10" fill="#232c44" stroke="#5b6a94" stroke-width="1.5"/>
    <text x="360" y="298" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">Canonical Architecture</text>
    <text x="360" y="326" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">Model</text>

    <!-- Row D: Neo4j -->
    <rect x="285" y="392" width="150" height="70" rx="10" fill="#232c44" stroke="#5b6a94" stroke-width="1.5"/>
    <text x="360" y="435" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Neo4j</text>

    <!-- Row E: outputs -->
    <rect x="20" y="494" width="330" height="86" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="185" y="531" fill="#eef0f5" font-size="18" text-anchor="middle">deterministic Cypher</text>
    <text x="185" y="557" fill="#eef0f5" font-size="18" text-anchor="middle">analyses</text>

    <rect x="370" y="494" width="330" height="86" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="535" y="531" fill="#eef0f5" font-size="18" text-anchor="middle">read-only natural-</text>
    <text x="535" y="557" fill="#eef0f5" font-size="18" text-anchor="middle">language query</text>

  </g>
</svg>
