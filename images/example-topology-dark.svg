<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Example topology: OrderService calls ProductService over REST and sends to payment-q, which PaymentService receives from and sends to invoice-q, which InvoiceService receives from.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a8"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif">

    <line x1="240" y1="50" x2="374" y2="50" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="307" y="38" fill="#9aa2b6" font-size="15" font-weight="bold" text-anchor="middle">REST</text>

    <line x1="130" y1="80" x2="130" y2="124" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="160" y="107" fill="#9aa2b6" font-size="15" font-weight="bold" text-anchor="start">SENDS</text>

    <line x1="130" y1="184" x2="130" y2="224" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <line x1="130" y1="290" x2="130" y2="334" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="160" y="317" fill="#9aa2b6" font-size="15" font-weight="bold" text-anchor="start">SENDS</text>

    <line x1="130" y1="394" x2="130" y2="434" stroke="#8b93a8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="20" y="20" width="220" height="60" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="130" y="57" fill="#eef0f5" font-size="18" text-anchor="middle">OrderService</text>

    <rect x="380" y="20" width="220" height="60" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="490" y="57" fill="#eef0f5" font-size="18" text-anchor="middle">ProductService</text>

    <rect x="20" y="130" width="220" height="54" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="130" y="164" fill="#eef0f5" font-size="18" text-anchor="middle">payment-q</text>

    <rect x="20" y="230" width="220" height="60" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="130" y="267" fill="#eef0f5" font-size="18" text-anchor="middle">PaymentService</text>

    <rect x="20" y="340" width="220" height="54" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="130" y="374" fill="#eef0f5" font-size="18" text-anchor="middle">invoice-q</text>

    <rect x="20" y="440" width="220" height="60" rx="10" fill="#1c2333" stroke="#3a4256" stroke-width="1.5"/>
    <text x="130" y="477" fill="#eef0f5" font-size="18" text-anchor="middle">InvoiceService</text>

  </g>
</svg>
